[project]
name = "perceptron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hdd167", email = "angus07@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
perceptron = "perceptron:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"