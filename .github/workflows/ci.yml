name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src tests
      - run: uv run pytest
        env:
          MPLBACKEND: Agg
      - name: Smoke-test the CLI
        run: |
          uv run perceptron --no-show --samples 60 --epochs 20 --figures /tmp/figures
          uv run python src/perceptron/cli.py --no-show --dataset iris --epochs 20